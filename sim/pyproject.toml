[project]
name = "wordrush-sim"
version = "0.1.0"
description = "Simulation lab for the WordRush word chain grid game"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
wordrush-sim = "wordrush_sim.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wordrush_sim"]

[tool.pytest.ini_options]
testpaths = ["tests"]
