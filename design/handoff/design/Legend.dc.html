<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>WordRush board language</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./wordrush.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&amp;family=Bungee&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="width: 980px; height: 1300px; box-sizing: border-box; padding: 40px; background: #CDD2DA; display: flex; flex-direction: column; gap: 24px; font-family: 'Bricolage Grotesque', system-ui, sans-serif; color: #10151F">
<div style="display: flex; flex-direction: column; gap: 6px">
<h1 style="margin: 0; font-family: 'Bungee', 'Arial Black', sans-serif; font-size: 32px; font-weight: 400">Board language</h1>
<p style="margin: 0; font-size: 16px; color: #3A4355">Every state pairs colour with a shape, line or icon, so the board still reads in greyscale.</p>
</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px">
<sc-for list="{{themes}}" as="th" hint-placeholder-count="2">
<div class="{{th.cls}}" style="border-radius: 24px; padding: 24px; display: flex; flex-direction: column; gap: 10px">
<span style="font-size: 11px; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted)">{{th.name}}</span>
<sc-for list="{{rows}}" as="row" hint-placeholder-count="12">
<div style="display: flex; align-items: center; gap: 16px; min-height: 46px">
<div style="width: 44px; flex: none; position: relative">
<div class="{{row.cls}}" style="width: 44px"><span class="l">{{row.l}}</span><sc-if value="{{row.ga}}" hint-placeholder-val="{{ false }}"><span class="gb"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"></path><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"></path></svg></span></sc-if></div>
</div>
<div style="display: flex; flex-direction: column; gap: 2px">
<span style="font-weight: 800; font-size: 14px">{{row.name}}</span>
<span style="font-size: 12px; color: var(--muted)">{{row.note}}</span>
</div>
</div>
</sc-for>
<div style="display: flex; flex-direction: column; gap: 8px; padding-top: 10px; border-top: 1px solid var(--line)">
<span style="font-weight: 800; font-size: 14px">Ways out: how much room your last word has left</span>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
<sc-for list="{{meters}}" as="m" hint-placeholder-count="4">
<div class="{{m.pl}}" style="padding: 8px 10px; gap: 6px">
<div class="{{m.room}}"><span class="segs"><sc-for list="{{m.segs}}" as="sg" hint-placeholder-count="4"><i class="{{sg}}"></i></sc-for></span><sc-if value="{{m.warn}}" hint-placeholder-val="{{ false }}"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l9.5 17h-19z"></path><path d="M12 10v4"></path><path d="M12 17.2h.01"></path></svg></sc-if></div>
<span class="rlbl">{{m.lbl}}</span>
</div>
</sc-for>
</div>
<span style="font-size: 12px; color: var(--muted)">At 1 way out the chip pulses and gets stripes. The colour never changes.</span>
</div>
</div>
</sc-for>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":980,"height":1300}}'>
class Component extends DCLogic {
  renderVals() {
    const seg = (n) => [0, 1, 2, 3].map((i) => (i < n ? 'on' : ''));
    return {
      themes: [{ name: 'Dark', cls: 'wr dark turnA' }, { name: 'Light', cls: 'wr light turnA' }],
      rows: [
        { cls: 'cell', l: '', name: 'Empty square', note: 'Flat, faint outline' },
        { cls: 'cell a', l: 'T', name: 'Blue letter', note: 'Round tile' },
        { cls: 'cell a recent', l: 'S', name: 'Blue · last word', note: 'Solid fill: where the chain grows' },
        { cls: 'cell b', l: 'O', name: 'Orange letter', note: 'Square tile with stripes' },
        { cls: 'cell b recent', l: 'G', name: 'Orange · last word', note: 'Solid fill, stripes kept' },
        { cls: 'cell a xa', l: 'R', name: 'Link letter', note: 'Where two of your words meet (small dot)' },
        { cls: 'cell a recent anchor', l: 'R', name: 'Your letters', note: 'Glowing: build off any of these' },
        { cls: 'cell gpart', l: 'A', name: 'Preview · still typing', note: 'Dotted grey outline' },
        { cls: 'cell gnew', l: 'A', name: 'Preview · ready to play', note: 'Dashed outline in your colour' },
        { cls: 'key anc', l: 'R', name: 'Your letter on the keyboard', note: 'Start or end your word with it' },
        { cls: 'cell a recent gring', l: 'R', ga: true, name: 'Preview · link letter', note: 'Ring + link badge' },
        { cls: 'cell b recent flash fb', l: 'U', name: 'Your opponent’s last move', note: 'Quick flash when your turn starts' },
        { cls: 'cell route', l: '', name: 'Way out', note: 'Dots: where you can still go' },
        { cls: 'cell a recent sealed', l: 'F', name: 'Boxed-in word', note: 'Heavy outline' },
        { cls: 'cell a wall', l: 'S', name: 'In the way', note: 'Any letter that blocks it, yours or theirs' },
        { cls: 'cell gap', l: '', name: 'Too small', note: 'Not enough space for a 3-letter word' },
      ],
      meters: [
        { pl: 'pl a', room: 'room open', segs: seg(4), warn: false, lbl: '5 ways out' },
        { pl: 'pl a', room: 'room tight', segs: seg(2), warn: false, lbl: '2 ways out' },
        { pl: 'pl a alarm', room: 'room danger', segs: seg(1), warn: true, lbl: '1 way out!' },
        { pl: 'pl a', room: 'room cornered', segs: seg(0), warn: true, lbl: 'Boxed in' },
      ],
    };
  }
}
</script>
</body>
</html>
